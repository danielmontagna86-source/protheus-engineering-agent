name: Seed verified MCP SDK
description: Download the same-run artifact and verify the SDK against the repository pin
inputs:
  artifact-id:
    description: Artifact ID returned by the reusable SDK preparation job
    required: true
runs:
  using: composite
  steps:
    - name: Download the same-run SDK
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        path: ${{ runner.temp }}/pea-mcp-sdk
        merge-multiple: 'true'
    - name: Verify and stage the locked SDK
      shell: bash
      run: node scripts/sdk-artifact.mjs "$RUNNER_TEMP/pea-mcp-sdk/modelcontextprotocol-server-2.4.0-verified.tgz"
