name: Release provenance

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    name: Build and attest exact artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Build exact release artifacts
        run: npm run build:release
      - name: Verify release checksums before attestation
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS
      - name: Attest artifacts, manifest, and checksum set
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |-
            release-artifacts/*-source.zip
            release-artifacts/*.vsix
            release-artifacts/*.cdx.json
            release-artifacts/release-manifest-*.json
            release-artifacts/SHA256SUMS
      - name: Verify persisted attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |-
          for subject in release-artifacts/*-source.zip release-artifacts/*.vsix release-artifacts/*.cdx.json release-artifacts/release-manifest-*.json release-artifacts/SHA256SUMS; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY"
          done
      - name: Preserve attested artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-release-artifacts
          path: release-artifacts/
          if-no-files-found: error
