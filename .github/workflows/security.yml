name: Dependency Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * 2"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  osv-scan:
    name: OSV dependency scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      scan-args: |-
        --lockfile=package-lock.json
      fail-on-vuln: true
      # Private GitHub Free repositories cannot upload Code Scanning SARIF.
      # Enable this after the repository becomes public.
      upload-sarif: false
