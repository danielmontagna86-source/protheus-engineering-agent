name: Dependency Security

on:
  pull_request:
    branches: [main, fix/reproducible-release-artifacts]
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scan:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan package lock with OSV
        uses: google/osv-scanner-action/osv-scanner-action@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347 # v2.6.0
        with:
          scan-args: |-
            --lockfile=package-lock.json
