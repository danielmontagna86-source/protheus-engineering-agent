name: ADVPL and TLPP review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Review pull request changes
        id: pea
        uses: ./
        with:
          scope: branch
          base-ref: ${{ github.event.pull_request.base.sha }}
          fail-on: major
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protheus-engineering-evidence
          path: .pea-results/
          if-no-files-found: error

