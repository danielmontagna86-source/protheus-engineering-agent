name: Bug report
description: Report a reproducible product defect without sensitive data.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, customer sources, database data, RPO contents or unsanitized production logs."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe sample and exact steps.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Extension, VS Code, Node.js and operating-system versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add sanitized output or screenshots if they help.
