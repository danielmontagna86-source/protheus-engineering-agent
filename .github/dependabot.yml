version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:20"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    target-branch: main
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:40"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    target-branch: main
